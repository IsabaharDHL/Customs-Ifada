<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<title>التصوير من الجوال - مولد الإفادات</title>
<style>
  :root { --navy:#16264d; --gold:#c9a24a; --bg:#eef1f6; --muted:#6b7280; --ok:#15803d; --err:#b91c1c; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); font-family: Tahoma, Arial, sans-serif; color:#1c2333; }
  header { background:var(--navy); color:#fff; padding:14px 16px; text-align:center; }
  header h1 { margin:0; font-size:18px; }
  header p { margin:4px 0 0; font-size:12px; opacity:.8; }
  main { max-width:560px; margin:0 auto; padding:12px; }
  .card { background:#fff; border-radius:14px; padding:14px; margin-bottom:12px; box-shadow:0 2px 10px rgba(0,0,0,.06); }
  .card h3 { margin:0 0 8px; color:var(--navy); font-size:16px; }
  .hint { font-size:12px; color:var(--muted); margin:0 0 10px; }
  .btn { display:block; width:100%; padding:14px; border:0; border-radius:10px; background:var(--navy); color:#fff; font-size:16px; font-weight:bold; margin-top:8px; }
  .btn.light { background:#fff; color:var(--navy); border:1.5px solid #dfe3ea; }
  .btn:disabled { opacity:.45; }
  #sigCanvas { border:1.5px dashed #c7cdd8; border-radius:10px; background:#fff; width:100%; height:160px; touch-action:none; display:block; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-top:10px; }
  .grid img { width:100%; aspect-ratio:1; object-fit:cover; border-radius:8px; border:1px solid #e5e7eb; }
  .status { font-size:13px; margin-top:8px; }
  .status.ok { color:var(--ok); } .status.err { color:var(--err); }
  #blocked { text-align:center; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<header>
  <h1>التصوير من الجوال</h1>
  <p>الصور والتوقيع يوصلون للكمبيوتر على طول، وينمسحون تلقائياً بعد ٥ أيام</p>
</header>
<main>
  <div class="card" id="blocked" hidden>
    <h3>الرابط غير صالح</h3>
    <p class="hint" id="blockedMsg">امسح رمز QR من جديد من صفحة الإفادة على الكمبيوتر.</p>
  </div>

  <div id="app" hidden>
    <div class="card">
      <h3>صور الأدلة</h3>
      <p class="hint">صوّر المادة، أو اختار صور من الجوال. تقدر تضيف أكثر من صورة.</p>
      <button class="btn" type="button" id="cameraBtn">📷 تصوير</button>
      <button class="btn light" type="button" id="galleryBtn">اختيار من الصور</button>
      <input type="file" id="cameraInput" accept="image/*" capture="environment" hidden>
      <input type="file" id="galleryInput" accept="image/*" multiple hidden>
      <div class="status" id="photoStatus" role="status"></div>
      <div class="grid" id="sent"></div>
    </div>

    <div class="card">
      <h3>التوقيع</h3>
      <p class="hint">وقّع بإصبعك داخل المربع، بعدين اضغط "إرسال التوقيع".</p>
      <canvas id="sigCanvas"></canvas>
      <button class="btn light" type="button" id="sigClear">مسح</button>
      <button class="btn" type="button" id="sigSend">إرسال التوقيع</button>
      <div class="status" id="sigStatus" role="status"></div>
    </div>
  </div>
</main>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getFirestore, doc, getDoc, addDoc, collection, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const app = initializeApp({
  apiKey: "AIzaSyCvQTWDDV-0f84fV36SPo6HIOOtmuYoyW0",
  authDomain: "dhl-customs-ifada.firebaseapp.com",
  projectId: "dhl-customs-ifada",
  storageBucket: "dhl-customs-ifada.firebasestorage.app",
  messagingSenderId: "707979991171",
  appId: "1:707979991171:web:afe423a95b356f882523b6"
});
const db = getFirestore(app);
const $ = id => document.getElementById(id);
const MAX_CHARS = 900000; // stay under the 1 MB Firestore document limit

const sid = location.hash.slice(1);
let expiresAt = null;

function blocked(msg) {
  $('app').hidden = true;
  $('blocked').hidden = false;
  if (msg) $('blockedMsg').textContent = msg;
}
function setStatus(el, msg, kind) {
  el.textContent = msg;
  el.className = 'status' + (kind ? ' ' + kind : '');
}

async function start() {
  if (!/^[A-Za-z0-9]{24,64}$/.test(sid)) return blocked();
  try {
    const snap = await getDoc(doc(db, 'phoneSessions', sid));
    if (!snap.exists()) return blocked();
    expiresAt = snap.data().expiresAt;
    $('app').hidden = false;
    initSignaturePad();
  } catch (e) {
    blocked('انتهت صلاحية هذا الرابط (٥ أيام) أو ما في اتصال. افتح صفحة الإفادة على الكمبيوتر وامسح رمز QR جديد.');
  }
}

async function send(kind, data) {
  await addDoc(collection(db, 'phoneSessions', sid, 'items'), {
    kind, data, createdAt: serverTimestamp(), expiresAt
  });
}

// ---------- photos ----------
function loadImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('صورة غير مقروءة')); };
    img.src = url;
  });
}
async function compress(file) {
  const img = await loadImage(file);
  let max = 1600, quality = 0.85, out = '';
  for (let i = 0; i < 8; i++) {
    const scale = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth * scale);
    c.height = Math.round(img.naturalHeight * scale);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    out = c.toDataURL('image/jpeg', quality);
    if (out.length <= MAX_CHARS) return out;
    quality = Math.max(0.5, quality - 0.1);
    if (quality === 0.5) max = Math.round(max * 0.8);
  }
  throw new Error('الصورة كبيرة واجد');
}
let sentCount = 0;
async function handleFiles(files) {
  files = Array.from(files);
  if (!files.length) return;
  const status = $('photoStatus');
  let done = 0, failed = 0;
  for (const file of files) {
    setStatus(status, `جاري الإرسال ${done + failed + 1} من ${files.length}…`);
    try {
      const data = await compress(file);
      await send('photo', data);
      done++; sentCount++;
      const thumb = document.createElement('img');
      thumb.src = data; thumb.alt = 'صورة مرسلة';
      $('sent').prepend(thumb);
    } catch (e) {
      console.error(e); failed++;
    }
  }
  if (failed) setStatus(status, `انرسل ${done}، وفشل ${failed}. تأكد من الإنترنت وجرب مرة ثانية.`, 'err');
  else setStatus(status, `✓ انرسلت ${done} صورة للكمبيوتر (المجموع ${sentCount})`, 'ok');
}
$('cameraBtn').onclick = () => $('cameraInput').click();
$('galleryBtn').onclick = () => $('galleryInput').click();
for (const id of ['cameraInput', 'galleryInput']) {
  $(id).onchange = e => { handleFiles(e.target.files).finally(() => { e.target.value = ''; }); };
}

// ---------- signature ----------
let ctx, drawing = false, last = null, inked = false;
function initSignaturePad() {
  const canvas = $('sigCanvas');
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * 2; canvas.height = rect.height * 2;
  ctx = canvas.getContext('2d');
  ctx.scale(2, 2);
  ctx.strokeStyle = ctx.fillStyle = '#16264d';
  ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const pos = e => {
    const r = canvas.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return { x: p.clientX - r.left, y: p.clientY - r.top };
  };
  const startDraw = e => {
    e.preventDefault();
    drawing = true; last = pos(e); inked = true;
    ctx.beginPath(); ctx.arc(last.x, last.y, ctx.lineWidth / 2, 0, Math.PI * 2); ctx.fill(); // a tap makes a dot
  };
  const moveDraw = e => {
    if (!drawing) return;
    e.preventDefault();
    const p = pos(e);
    ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke();
    last = p;
  };
  const endDraw = () => { drawing = false; };
  canvas.addEventListener('touchstart', startDraw, { passive: false });
  canvas.addEventListener('touchmove', moveDraw, { passive: false });
  canvas.addEventListener('touchend', endDraw);
  canvas.addEventListener('mousedown', startDraw);
  canvas.addEventListener('mousemove', moveDraw);
  window.addEventListener('mouseup', endDraw);
}
$('sigClear').onclick = () => {
  const c = $('sigCanvas');
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, c.width, c.height); ctx.restore();
  inked = false;
  setStatus($('sigStatus'), '');
};
$('sigSend').onclick = async () => {
  const status = $('sigStatus');
  if (!inked) return setStatus(status, 'وقّع أول داخل المربع.', 'err');
  $('sigSend').disabled = true;
  setStatus(status, 'جاري الإرسال…');
  try {
    await send('signature', $('sigCanvas').toDataURL('image/png'));
    setStatus(status, '✓ انرسل التوقيع للكمبيوتر', 'ok');
  } catch (e) {
    console.error(e);
    setStatus(status, 'ما انرسل التوقيع. تأكد من الإنترنت وجرب مرة ثانية.', 'err');
  } finally {
    $('sigSend').disabled = false;
  }
};

start();
</script>
</body>
</html>
